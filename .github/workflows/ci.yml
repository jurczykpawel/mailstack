name: CI

# Builds what a release ships, without secrets or a Cloudflare account, so dependency
# updates (wrangler, esbuild, runtime libraries, Docker actions) are proven before they
# merge: the Worker bundle through `wrangler deploy --dry-run`, the Node build and the
# container image with the release smoke test. Release tags reuse this workflow.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # Setup reads the configuration from outside the repository, like a release.
      - name: Setup with the example configuration
        run: |
          cp config/mailstack.example.json "$RUNNER_TEMP/mailstack.json"
          echo "MAILSTACK_CONFIG=$RUNNER_TEMP/mailstack.json" >> "$GITHUB_ENV"
          MAILSTACK_CONFIG="$RUNNER_TEMP/mailstack.json" npm run setup
      - name: Build the Worker (wrangler dry run, no account)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run build:node
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The same Docker actions as the release, so their updates are exercised here.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mailstack:smoke
      - name: Smoke
        run: |
          jq '{version, brands: {demo: .brands.demo}, logging, sender: {type:"smtp"}}' config/mailstack.example.json > "$RUNNER_TEMP/mailstack.json"
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          docker run -d --name smoke --read-only --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp -v "$RUNNER_TEMP/mailstack.json:/config/mailstack.json:ro" -e SMTP_HOST=localhost mailstack:smoke
          timeout 60 bash -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' smoke)\" = healthy ]; do sleep 2; done"
          docker exec smoke node -e 'fetch("http://127.0.0.1:8080/health").then(async r=>{const h=await r.json();if(!r.ok||h.ok!==true||h.store!=="ok")process.exit(1)}).catch(()=>process.exit(1))'
          docker stop smoke
