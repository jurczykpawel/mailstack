name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Reset previous auto-merge request
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
          fi
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        if: vars.DEPENDENCY_AUTOMERGE_ENABLED == 'true'
      - name: Enable native auto-merge for eligible updates
        if: vars.DEPENDENCY_AUTOMERGE_ENABLED == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          if ! jq -e 'length > 0 and all(.[];
            .packageEcosystem == "npm_and_yarn" and .directory == "/" and
            .dependencyGroup == "maintenance" and .maintainerChanges == false and
            (.updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor") and
            (.prevVersion | test("^[1-9][0-9]*\\.[0-9]+\\.[0-9]+$")) and (.newVersion | test("^[1-9][0-9]*\\.[0-9]+\\.[0-9]+$")) and
            (.dependencyName | test("^(@hpke/|age-encryption$|nodemailer$|aws4fetch$)" ) | not)
          )' <<<"$UPDATES" >/dev/null; then
            echo 'Update requires review.'
            exit 0
          fi
          pr=$(gh pr view "$PR" --repo "$REPO" --json headRefOid,baseRefName,isDraft,labels,files,changedFiles)
          if ! jq -e --arg sha "$HEAD_SHA" '
            .headRefOid == $sha and .baseRefName == "main" and .isDraft == false and
            (.labels | all(.name != "do-not-merge" and .name != "wip" and .name != "security")) and
            .changedFiles > 0 and .changedFiles == (.files | length) and
            (.files | all(.path == "package.json" or .path == "package-lock.json"))
          ' <<<"$pr" >/dev/null; then
            echo 'Files or pull request state require review.'
            exit 0
          fi
          manifest=$(gh api "repos/$REPO/contents/package.json?ref=$BASE_SHA" --jq .content | base64 -d)
          if ! jq -en --argjson updates "$UPDATES" --argjson manifest "$manifest" '
            ($manifest.overrides // {} | [.. | objects | keys[]]) as $overrides |
            all($updates[]; .dependencyName as $name | $overrides | index($name) | not)
          ' >/dev/null; then
            echo 'Override update requires review.'
            exit 0
          fi
          rules=$(gh api "repos/$REPO/rules/branches/main")
          if ! jq -e 'any(.[]; .type == "required_status_checks" and
            .parameters.strict_required_status_checks_policy == true and
            any(.parameters.required_status_checks[]; .context == "ci-required" and .integration_id == 15368))' <<<"$rules" >/dev/null; then
            echo 'Required merge checks are not configured.'
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"
