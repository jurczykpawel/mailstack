name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same checks as every push: tests, the Worker dry-run build and the image smoke test.
  validate:
    uses: ./.github/workflows/ci.yml
  image:
    needs: validate
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/mailstack.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/jurczykpawel/mailstack
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      - name: Smoke
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          skopeo copy --override-arch amd64 oci-archive:/tmp/mailstack.tar docker-daemon:mailstack:smoke
          jq '{version, brands: {demo: .brands.demo}, logging, sender: {type:"smtp"}}' config/mailstack.example.json > "$RUNNER_TEMP/mailstack.json"
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          docker run -d --name smoke --read-only --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp -v "$RUNNER_TEMP/mailstack.json:/config/mailstack.json:ro" -e SMTP_HOST=localhost mailstack:smoke
          timeout 60 bash -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' smoke)\" = healthy ]; do sleep 2; done"
          docker exec smoke node -e 'fetch("http://127.0.0.1:8080/health").then(async r=>{const h=await r.json();if(!r.ok||h.ok!==true||h.store!=="ok")process.exit(1)}).catch(()=>process.exit(1))'
          docker stop smoke
      - name: Publish
        env: {REGISTRY_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          version="${GITHUB_REF_NAME#v}"
          tags=("$version" "sha-$GITHUB_SHA")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags+=(latest); fi
          for tag in "${tags[@]}"; do skopeo copy --all oci-archive:/tmp/mailstack.tar "docker://ghcr.io/jurczykpawel/mailstack:$tag"; done
