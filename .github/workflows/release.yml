name: Release

on:
  push:
    tags: ["v*"]
  # Builds and smoke-tests both platforms; only a pushed v* tag publishes, never a manual run.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jurczykpawel/mailstack
  LABELS: |
    org.opencontainers.image.source=https://github.com/jurczykpawel/mailstack
    org.opencontainers.image.revision=${{ github.sha }}
    org.opencontainers.image.version=${{ github.ref_name }}
    org.opencontainers.image.licenses=MIT

jobs:
  # The same checks as every push: tests, the Worker dry-run build and the image smoke test.
  validate:
    uses: ./.github/workflows/ci.yml
  # One native runner per platform (QEMU emulation crashed npm ci on arm64); each smoke-tests its image,
  # then pushes it by digest only. The publish job joins the digests under the release tags.
  image:
    needs: validate
    strategy:
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-24.04, arch: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          labels: ${{ env.LABELS }}
          load: true
          tags: mailstack:smoke
      - name: Smoke
        run: .github/scripts/smoke-image.sh mailstack:smoke
      - name: Log in to GHCR
        if: github.event_name == 'push'
        env: {REGISTRY_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Same build from the cache just smoke-tested, exported untagged by digest.
      - id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        if: github.event_name == 'push'
        env: {DIGEST: '${{ steps.push.outputs.digest }}'}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish
        env: {REGISTRY_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        working-directory: ${{ runner.temp }}/digests
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sources=(); for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "expected two platform digests" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "$IMAGE:$version" -t "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
