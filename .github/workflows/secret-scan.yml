name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scan the full history directly (the action's BASE/HEAD diff errors out when
      # BASE == HEAD, e.g. on a single-commit or freshly force-pushed repo).
      - name: TruffleHog secret scan (full history)
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc/scripts/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v3.99.9
          "$RUNNER_TEMP/bin/trufflehog" git "file://$PWD" --only-verified --fail --no-update
