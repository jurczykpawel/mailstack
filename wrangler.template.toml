# Template for wrangler.toml — committed. DO NOT put real ids/domains/secrets here.
# `npm run setup` (and predev/predeploy) generates wrangler.toml from this file by
# substituting env vars from your gitignored .env (see .env.example):
#   MAILSTACK_WORKER_NAME, SES_REGION, MAILSTACK_D1_ID, MAILSTACK_D1_PREVIEW_ID, MAILSTACK_ROUTE, MAILSTACK_INTERNAL_ROUTE,
#   MAILSTACK_ACCESS_TEAM_DOMAIN, MAILSTACK_ACCESS_AUD, MAILSTACK_EGRESS_URL
name = "${MAILSTACK_WORKER_NAME}"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — emitted only when MAILSTACK_ROUTE is set; otherwise the default
# *.workers.dev URL is used. The domain's zone must be in the same Cloudflare account.
__ROUTES__

[triggers]
# Minute: background jobs (src/core/jobs.ts). Hour at :17: retention, with the larger hourly CPU limit.
crons = ["* * * * *"]

[build]
command = "node scripts/bundle-config.ts --verify"

[vars]
BUILD_CONFIG_SHA = "${BUILD_CONFIG_SHA}"
SES_REGION = ${SES_REGION}
SES_CONFIGURATION_SET = ${SES_CONFIGURATION_SET}
# Brand the Sellf webhook (/v1/hooks/sellf) uses when a request has no ?brand= (default: acme).
SELLF_DEFAULT_BRAND = "${SELLF_DEFAULT_BRAND}"
# Host serving /internal/v2/* for the panel (MAILSTACK_INTERNAL_ROUTE) and the panel assertion audience; empty disables the internal API.
INTERNAL_HOST = ${INTERNAL_HOST}
# Profile (a): audience of panel assertions arriving through the service binding to the `Internal` entrypoint (MAILSTACK_PANEL_AUDIENCE).
PANEL_AUDIENCE = ${PANEL_AUDIENCE}
# Cloudflare Access team host and application AUD; the internal host accepts only requests with a valid Access JWT.
ACCESS_TEAM_DOMAIN = ${ACCESS_TEAM_DOMAIN}
ACCESS_AUD = ${ACCESS_AUD}
# Egress service behind a Tunnel (Pro webhooks, resend callbacks); empty keeps them disabled, never a fallback to fetch.
EGRESS_URL = ${EGRESS_URL}

[[d1_databases]]
binding = "DB"
database_name = "${MAILSTACK_WORKER_NAME}"
database_id = "${MAILSTACK_D1_ID}"
preview_database_id = "${MAILSTACK_D1_PREVIEW_ID}"
migrations_dir = ".wrangler/migrations"

# SECRETS — never in any file. Set with `wrangler secret put <NAME>`:
#   SES_ACCESS_KEY_ID, SES_SECRET_ACCESS_KEY, TURNSTILE_SECRET, API_KEY, ALTCHA_HMAC_KEY,
#   PANEL_ASSERTION_KEYS (with MAILSTACK_INTERNAL_ROUTE; JSON [{kid, key}], several entries during rotation)
#   EGRESS_KEYS, EGRESS_ACCESS_CLIENT_ID, EGRESS_ACCESS_CLIENT_SECRET (with MAILSTACK_EGRESS_URL)
